<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonar — WCAG 2.2 reference</title>
<link rel="icon" href="assets/vesperlab.svg" type="image/svg+xml">
<style>

  /* ── Jetons du design system Vesper Lab V2 ──  */
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap');

/* ---- Typographie (tokens/typography.css) ---- */
:root{
  --font-display:'Noto Serif',Georgia,'Times New Roman',serif;
  --font-body:'Noto Sans',Arial,Helvetica,sans-serif;
  --font-mono:'Noto Sans Mono','Courier New',monospace;

  --font-size-display:44px;
  --font-size-h1:32px;
  --font-size-h2:24px;
  --font-size-h3:19px;
  --font-size-lead:19px;
  --font-size-body:17px;
  --font-size-body-sm:15px;
  --font-size-caption:13px;

  --font-size-ui-title:24px;
  --font-size-ui-h2:19px;
  --font-size-ui-h3:15px;
  --font-size-ui-body:15px;
  --font-size-ui-body-sm:14px;
  --font-size-ui-caption:13px;

  --font-size-eyebrow:17px;

  --leading-tight:1.18;
  --leading-heading:1.25;
  --leading-body:1.65;

  --tracking-display:0.005em;
  --tracking-eyebrow:0.12em;
  --tracking-wordmark:0.04em;
}

/* ---- Espacements (tokens/spacing.css) ---- */
:root{
  --space-1:4px;
  --space-2:6px;
  --space-3:8px;
  --space-4:10px;
  --space-5:12px;
  --space-6:16px;
  --space-7:18px;
  --space-8:24px;
  --space-9:28px;
  --space-10:32px;

  --radius-sm:6px;
  --radius-md:8px;
  --radius-lg:10px;
  --radius-pill:20px;

  --shadow-card:0 1px 4px rgba(0,0,0,0.24);
  --shadow-popover:0 8px 24px rgba(0,0,0,0.4);

  --min-hit:44px;
}

/* ---- Couleurs (tokens/colors.css) ---- */
:root{
  /* Neutres : noir à reflet fonte et bois foncé (oklch, teinte 150) */
  --ink-975:oklch(0.11 0.006 150);
  --ink-950:oklch(0.145 0.008 150);
  --ink-900:oklch(0.195 0.01 150);
  --ink-800:oklch(0.235 0.012 150);
  --ink-700:oklch(0.30 0.014 150);
  --cream-100:oklch(0.93 0.018 85);
  --cream-300:oklch(0.85 0.018 85);
  --cream-500:oklch(0.72 0.02 85);
  --cream-700:oklch(0.66 0.02 85);
  --hairline:rgba(233,223,200,0.14);
  --hairline-strong:rgba(233,223,200,0.18);

  /* Accent unique : sauge séchée (teinte 128) */
  --sage-300:oklch(0.89 0.05 128);
  --sage-500:oklch(0.83 0.055 128);
  --sage-700:oklch(0.66 0.055 128);
  --sage-900:oklch(0.44 0.05 128);
  --sage-on:oklch(0.145 0.008 150);

  /* Palette de soutien */
  --paper-100:#F7F1E9;
  --stone-500:#BDB6AE;
  --coral-300:#F0A9A2;
  --coral-700:#A05C57;
  --void-950:#0E0F0D;
  --olive-900:#272E24;

  /* Alias sémantiques */
  --surface-page:var(--ink-975);
  --surface-app:var(--ink-950);
  --surface-card:var(--ink-900);
  --surface-input:var(--ink-800);
  --surface-raised:var(--ink-700);
  --surface-accent-deep:var(--sage-900);
  --text-body:var(--cream-100);
  --text-secondary:var(--cream-300);
  --text-muted:var(--cream-500);
  --text-faint:var(--cream-700);
  --text-on-accent-deep:var(--cream-100);
  --border-default:var(--hairline);
  --border-strong:var(--hairline-strong);
  --accent:var(--sage-500);
  --accent-hover:var(--sage-300);
  --accent-quiet:var(--sage-700);
  --accent-on:var(--sage-on);
  --focus-ring:var(--sage-500);
  --link:var(--sage-500);
  --link-hover:var(--sage-300);
  --danger:var(--coral-700);
  --success:var(--sage-700);
}

  html { scroll-behavior: smooth; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--surface-page); color: var(--text-body); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  body { display: flex; flex-direction: column; height: 100vh; }

  #searchWrap { padding: 10px; border-bottom: 1px solid var(--border-default); background: var(--surface-card); flex: none; }
  #q { width: 100%; box-sizing: border-box; background: var(--surface-page); border: 1px solid var(--border-strong); border-radius: 8px; padding: 10px 11px; color: var(--text-body); font-size: 13.5px; min-height: 40px; }
  #pills { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
  .pill { appearance: none; cursor: pointer; border-radius: 999px; padding: 5px 11px; font-size: 11.5px; min-height: 30px; background: transparent; border: 1px solid var(--border-strong); color: var(--text-muted); }
  .pill[aria-pressed="true"] { background-color: color-mix(in srgb, var(--pc) 18%, transparent); border-color: var(--pc); color: var(--pc); }
  #hint { margin: 7px 0 0; font-size: 11px; color: var(--text-muted); }

  #listWrap { flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--surface-page); }
  #list { list-style: none; margin: 0; padding: 5px; }
  #list li { margin: 0; }
  .row { appearance: none; cursor: pointer; width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; font-size: 13px; min-height: 42px; border: 1px solid transparent; background: transparent; color: var(--text-body); }
  .row.active { border-color: #7A659E; background: var(--surface-raised); }
  .row .id { font-variant-numeric: tabular-nums; color: var(--text-muted); min-width: 44px; flex: none; }
  .row .name { flex: 1; }
  .row .level { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; border: 1px solid; flex: none; }
  .row .version { font-size: 11px; color: var(--text-muted); white-space: nowrap; flex: none; }
  #noResults { margin: 0; padding: 18px 16px; font-size: 12.5px; color: var(--text-muted); }

  #detail { display: none; flex-direction: column; gap: 12px; flex: 1 1 auto; min-height: 0; overflow: auto; padding: 14px 16px; background: var(--surface-card); }
  #back { appearance: none; cursor: pointer; align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--border-strong); border-radius: 999px; padding: 6px 12px; font-size: 11.5px; color: var(--link); min-height: 32px; }
  #meta { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  #title { margin: 2px 0 0; font-size: 16px; font-weight: 600; color: var(--text-body); }
  #linkRow { display: flex; gap: 8px; flex-wrap: wrap; }
  #linkRow a { display: inline-flex; align-items: center; padding: 7px 12px; border: 1px solid var(--accent-quiet); border-radius: 999px; font-size: 11.5px; color: var(--accent); text-decoration: none; min-height: 32px; }
  #copyRow { display: flex; gap: 7px; flex-wrap: wrap; }
  #copyRow button { appearance: none; cursor: pointer; background: var(--surface-page); border: 1px solid var(--border-strong); border-radius: 999px; padding: 6px 11px; font-size: 11.5px; color: var(--link); min-height: 32px; }
  #toastWrap { min-height: 30px; padding: 6px 16px 10px; background: var(--surface-card); flex: none; }
  #toast { margin: 0; padding: 6px 12px; display: inline-block; border: 1px solid var(--accent-quiet); border-radius: 999px; background: var(--surface-page); font-size: 11.5px; color: var(--accent); }

  #swTop { display: flex; justify-content: flex-end; margin-bottom: 6px; }
  #lang { appearance: none; cursor: pointer; background: transparent; border: 1px solid var(--border-strong); border-radius: 999px; padding: 4px 12px; font-size: 11.5px; font-weight: 700; color: var(--text-body); min-height: 30px; }
  #lang:hover { border-color: var(--accent); color: var(--accent); }

  #prose { display: flex; flex-direction: column; gap: 12px; }
  .prose-sec h3 { margin: 0 0 3px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
  .prose-sec p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--text-body); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; background: var(--surface-raised); color: var(--text-secondary); border: 1px solid var(--border-default); }
  .xref-list { display: flex; gap: 6px; flex-wrap: wrap; }
  .xref-chip { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--text-secondary); border: 1px solid var(--border-default); }
  .xref-note { margin: 6px 0 0; font-size: 11px; font-style: italic; color: var(--text-muted); border-left: 2px solid var(--accent-quiet); padding-left: 10px; }
</style>
</head>
<body>

<div id="searchWrap">
  <div id="swTop"><button type="button" id="lang">Français</button></div>
  <input type="search" id="q" aria-label="Search a criterion" aria-describedby="hint" placeholder="Search: name, id, guideline…">
  <div id="pills"></div>
  <p id="hint"><span id="hintKeys">↑ ↓ to browse · Enter to open · Esc to close</span> · <span id="resultCount"></span></p>
</div>

<div id="listWrap">
  <ul id="list"></ul>
  <p id="noResults" hidden>No criterion matches.</p>
</div>

<div id="detail">
  <button type="button" id="back">← Back to the list</button>
  <div>
    <div id="meta"></div>
    <h2 id="title"></h2>
  </div>
  <div id="prose"></div>
  <div id="linkRow"></div>
  <div id="copyRow"></div>
</div>

<div id="toastWrap"><span id="toast" hidden></span></div>

<script src="assets/logo.b64.js"></script>
<script>

// Sonar (public) 
(function () {
  'use strict';

  var LEVEL_COLOR = { A: '#A6CA93', AA: '#C6B2ED', AAA: '#F0A9A2' };
  var LANG_KEY = 'vesperlab-toolkit:lang'; // partagée avec l'annuaire du Toolkit

  // Chaînes d'interface (la prose des critères vient bilingue du JSON, voir L()).
  var I18N = {
    fr: {
      langToggle: 'English',
      searchLabel: 'Rechercher un critère',
      searchPlaceholder: 'Recherche : nom, identifiant, règle…',
      hintKeys: '↑ ↓ pour parcourir · Entrée pour ouvrir · Échap pour fermer',
      results: '{n} résultat(s)',
      noResults: 'Aucun critère ne correspond.',
      back: '← Retour à la liste',
      levelPrefix: 'Niveau',
      whatWcag: 'Ce que disent les WCAG',
      plain: 'En clair',
      remediation: 'Piste de correction',
      affects: 'Concerne',
      otherStandards: 'Autres référentiels',
      qcShort: 'Exigé au Québec',
      goToPage: 'Ouvrir la page W3C ↗',
      understanding: 'Comprendre ce critère ↗',
      copyMd: 'Lien Markdown', copyHtml: 'Lien HTML', copyName: 'Nom seul', copyUrl: 'URL seule',
      copiedMd: 'Lien Markdown copié.', copiedHtml: 'Lien HTML copié.',
      copiedName: 'Nom copié.', copiedUrl: 'URL copiée.',
      copyFail: 'Copie impossible.',
      dataError: 'Impossible de charger la liste des critères WCAG.'
    },
    en: {
      langToggle: 'Français',
      searchLabel: 'Search a criterion',
      searchPlaceholder: 'Search: name, id, guideline…',
      hintKeys: '↑ ↓ to browse · Enter to open · Esc to close',
      results: '{n} result(s)',
      noResults: 'No criterion matches.',
      back: '← Back to the list',
      levelPrefix: 'Level',
      whatWcag: 'What WCAG says',
      plain: 'In plain language',
      remediation: 'A fix to aim for',
      affects: 'Affects',
      otherStandards: 'Other standards',
      qcShort: 'Required in Québec',
      goToPage: 'Open the W3C page ↗',
      understanding: 'Understanding this criterion ↗',
      copyMd: 'Markdown link', copyHtml: 'HTML link', copyName: 'Name only', copyUrl: 'URL only',
      copiedMd: 'Markdown link copied.', copiedHtml: 'HTML link copied.',
      copiedName: 'Name copied.', copiedUrl: 'URL copied.',
      copyFail: 'Copy failed.',
      dataError: 'Could not load the WCAG criteria list.'
    }
  };
  // Libellés des 9 publics (énumération fermée de la base).
  var DIS = {
    'blind': { fr: 'Aveugle', en: 'Blind' },
    'low-vision': { fr: 'Malvoyant', en: 'Low vision' },
    'deaf-hoh': { fr: 'Sourd ou malentendant', en: 'Deaf or hard of hearing' },
    'motor': { fr: 'Handicap moteur', en: 'Motor' },
    'cognitive': { fr: 'Handicap cognitif', en: 'Cognitive' },
    'vestibular': { fr: 'Troubles vestibulaires', en: 'Vestibular' },
    'photosensitive': { fr: 'Épilepsie photosensible', en: 'Photosensitive' },
    'color-blind': { fr: 'Daltonisme', en: 'Colour blindness' },
    'speech': { fr: 'Trouble de la parole', en: 'Speech' }
  };
  var TAG_ORDER = ['blind', 'low-vision', 'color-blind', 'deaf-hoh', 'motor', 'speech', 'cognitive', 'vestibular', 'photosensitive'];

  var state = { data: [], q: '', levels: [], versions: [], active: 0, selectedId: null, lang: 'fr' };

  function T(key) { return I18N[state.lang][key]; }
  function L(field) {
    if (!field) return '';
    if (typeof field === 'string') return field;
    return field[state.lang] || field.fr || field.en || '';
  }
  function dis(tag) { return DIS[tag] ? DIS[tag][state.lang] : tag; }
  function critName(c) { return (state.lang === 'fr' && c.name_fr) ? c.name_fr : c.name; }

  var qInput = document.getElementById('q');
  var pillsEl = document.getElementById('pills');
  var listEl = document.getElementById('list');
  var listWrapEl = document.getElementById('listWrap');
  var noResultsEl = document.getElementById('noResults');
  var detailEl = document.getElementById('detail');
  var backBtn = document.getElementById('back');
  var metaEl = document.getElementById('meta');
  var titleEl = document.getElementById('title');
  var proseEl = document.getElementById('prose');
  var linkRowEl = document.getElementById('linkRow');
  var copyRowEl = document.getElementById('copyRow');
  var resultCountEl = document.getElementById('resultCount');
  var hintKeysEl = document.getElementById('hintKeys');
  var langEl = document.getElementById('lang');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function notify(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2200);
  }

  // Repli textarea+execCommand : l'API clipboard moderne peut être bloquée ici, Sonar tournant
  // dans une iframe cross-origin (la permission clipboard-write n'est pas toujours déléguée par
  // la page qui l'héberge, même quand scripts/sonar.js la demande sur la balise <iframe>).
  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  function copy(text, msg) {
    if (!text) return;
    var done = function () { notify(msg); };
    var fail = function () {
      if (fallbackCopy(text)) { done(); }
      else { notify('Copy failed.'); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fail);
    } else {
      fail();
    }
  }

  // Applique les chaînes d'interface statiques dans la langue courante.
  function applyStatic() {
    document.documentElement.lang = state.lang;
    document.title = state.lang === 'fr' ? 'Sonar — référentiel WCAG 2.2' : 'Sonar — WCAG 2.2 reference';
    langEl.textContent = T('langToggle');
    qInput.setAttribute('aria-label', T('searchLabel'));
    qInput.setAttribute('placeholder', T('searchPlaceholder'));
    hintKeysEl.textContent = T('hintKeys');
    backBtn.textContent = T('back');
    noResultsEl.textContent = T('noResults');
  }

  function setLang(lang) {
    state.lang = (lang === 'en') ? 'en' : 'fr';
    try { localStorage.setItem(LANG_KEY, state.lang); } catch (e) {}
    applyStatic();
    renderPills();
    renderList();
    if (state.selectedId) openDetail(state.selectedId, false);
  }

  function filtered() {
    var q = state.q.trim().toLowerCase();
    return state.data.filter(function (c) {
      if (q && (c.id + ' ' + c.name + ' ' + (c.name_fr || '') + ' ' + c.guidelineName).toLowerCase().indexOf(q) < 0) return false;
      if (state.levels.length && state.levels.indexOf(c.level) < 0) return false;
      if (state.versions.length && state.versions.indexOf(c.version) < 0) return false;
      return true;
    });
  }

  function renderPills() {
    var versions = [];
    state.data.forEach(function (c) { if (versions.indexOf(c.version) < 0) versions.push(c.version); });
    versions.sort();

    pillsEl.innerHTML = '';
    ['A', 'AA', 'AAA'].forEach(function (lvl) {
      pillsEl.appendChild(makePill(T('levelPrefix') + ' ' + lvl, state.levels.indexOf(lvl) > -1, LEVEL_COLOR[lvl], function () { toggleIn('levels', lvl); }));
    });
    versions.forEach(function (v) {
      pillsEl.appendChild(makePill('WCAG ' + v, state.versions.indexOf(v) > -1, '#C6B2ED', function () { toggleIn('versions', v); }));
    });
  }

  function makePill(label, on, color, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'pill';
    b.textContent = label;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.style.setProperty('--pc', color);
    b.addEventListener('click', onClick);
    return b;
  }

  function toggleIn(key, val) {
    var cur = state[key];
    var i = cur.indexOf(val);
    state[key] = i > -1 ? cur.filter(function (v) { return v !== val; }) : cur.concat([val]);
    state.active = 0;
    renderPills();
    renderList();
  }

  function renderList() {
    var list = filtered();
    listEl.innerHTML = '';
    list.forEach(function (c, i) {
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'row' + (i === state.active ? ' active' : '');
      btn.innerHTML =
        '<span class="id">' + esc(c.id) + '</span>' +
        '<span class="name">' + esc(critName(c)) + '</span>' +
        '<span class="level" style="color:' + LEVEL_COLOR[c.level] + ';border-color:' + LEVEL_COLOR[c.level] + '55;background:' + LEVEL_COLOR[c.level] + '1f">' + esc(c.level) + '</span>' +
        '<span class="version">WCAG ' + esc(c.version) + '</span>';
      btn.addEventListener('click', function () { openDetail(c.id); });
      li.appendChild(btn);
      listEl.appendChild(li);
    });
    noResultsEl.hidden = !(state.data.length > 0 && list.length === 0);
    resultCountEl.textContent = T('results').replace('{n}', list.length);
  }

  // Fait défiler la liste pour garder la ligne active visible (navigation clavier).
  function scrollActiveIntoView() {
    var li = listEl.children[state.active];
    if (!li) return;
    var top = li.offsetTop, bottom = top + li.offsetHeight;
    if (top < listWrapEl.scrollTop) listWrapEl.scrollTop = top - 4;
    else if (bottom > listWrapEl.scrollTop + listWrapEl.clientHeight) listWrapEl.scrollTop = bottom - listWrapEl.clientHeight + 4;
  }

  function move(delta) {
    var list = filtered();
    if (!list.length) return;
    var next = state.active + delta;
    if (next < 0) next = list.length - 1;
    if (next > list.length - 1) next = 0;
    state.active = next;
    renderList();
    scrollActiveIntoView();
  }

  function proseSec(headKey, bodyHtml) {
    return '<div class="prose-sec"><h3>' + esc(T(headKey)) + '</h3>' + bodyHtml + '</div>';
  }

  function openDetail(id, refocus) {
    var c = state.data.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    state.selectedId = id;

    listWrapEl.hidden = true;
    document.getElementById('searchWrap').hidden = true;
    detailEl.style.display = 'flex';

    metaEl.textContent = T('levelPrefix') + ' ' + c.level + ' · WCAG ' + c.version + ' · ' + c.guidelineId + ' ' + c.guidelineName;
    titleEl.textContent = c.id + ' ' + critName(c);

    // Prose : les 3 couches publiques + publics concernés + croisements référentiels.
    var out = '';
    var descr = L(c.description);
    if (descr) out += proseSec('whatWcag', '<p>' + esc(descr) + '</p>');
    var plain = L(c.plain);
    if (plain) out += proseSec('plain', '<p>' + esc(plain) + '</p>');
    var rem = L(c.remediation);
    if (rem) out += proseSec('remediation', '<p>' + esc(rem) + '</p>');

    var tags = (c.disability_tags || []).slice().sort(function (a, b) {
      return TAG_ORDER.indexOf(a) - TAG_ORDER.indexOf(b);
    });
    if (tags.length) {
      out += proseSec('affects', '<div class="tags">' +
        tags.map(function (tg) { return '<span class="tag">' + esc(dis(tg)) + '</span>'; }).join('') + '</div>');
    }

    var xr = c.xref || {};
    var chips = [];
    if ((xr.en301549 || []).length) chips.push('<span class="xref-chip">EN 301 549 : ' + esc(xr.en301549.join(', ')) + '</span>');
    if ((xr.rgaa || []).length) chips.push('<span class="xref-chip">RGAA 4.1 : ' + esc(xr.rgaa.join(', ')) + '</span>');
    if ((xr.qc || []).length) chips.push('<span class="xref-chip">SGQRI 008 3.0 · ' + esc(T('qcShort')) + '</span>');
    var note = L(c.xref_note);
    if (chips.length || note) {
      out += proseSec('otherStandards',
        (chips.length ? '<div class="xref-list">' + chips.join('') + '</div>' : '') +
        (note ? '<p class="xref-note">' + esc(note) + '</p>' : ''));
    }
    proseEl.innerHTML = out;

    var md = '[' + c.id + ' ' + c.name + '](' + c.url + ')';
    var html = '<a href="' + c.url + '">' + c.id + ' ' + c.name + '</a>';

    linkRowEl.innerHTML =
      '<a href="' + esc(c.url) + '" target="_blank" rel="noreferrer">' + esc(T('goToPage')) + '</a>' +
      '<a href="' + esc(c.understandingUrl) + '" target="_blank" rel="noreferrer">' + esc(T('understanding')) + '</a>';

    copyRowEl.innerHTML = '';
    [
      [T('copyMd'), md, T('copiedMd')],
      [T('copyHtml'), html, T('copiedHtml')],
      [T('copyName'), c.id + ' ' + c.name, T('copiedName')],
      [T('copyUrl'), c.url, T('copiedUrl')]
    ].forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = a[0];
      b.addEventListener('click', function () { copy(a[1], a[2]); });
      copyRowEl.appendChild(b);
    });

    if (refocus !== false) backBtn.focus();
  }

  function closeDetail() {
    state.selectedId = null;
    detailEl.style.display = 'none';
    listWrapEl.hidden = false;
    document.getElementById('searchWrap').hidden = false;
    qInput.focus();
  }

  backBtn.addEventListener('click', closeDetail);

  qInput.addEventListener('input', function (e) {
    state.q = e.target.value;
    state.active = 0;
    renderList();
  });

  qInput.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      var c = filtered()[state.active];
      if (c) openDetail(c.id);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.selectedId) { closeDetail(); }
  });

  langEl.addEventListener('click', function () {
    setLang(state.lang === 'fr' ? 'en' : 'fr');
  });

  // Langue de départ : choix mémorisé (clé partagée avec l'annuaire), sinon la langue du
  // navigateur, sinon français.
  var stored = null;
  try { stored = localStorage.getItem(LANG_KEY); } catch (e) {}
  state.lang = (stored === 'en' || stored === 'fr')
    ? stored
    : ((navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'fr');
  applyStatic();

  fetch('assets/wcag22-public.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      state.data = data;
      renderPills();
      renderList();
    })
    .catch(function () { notify(T('dataError')); });

  setTimeout(function () { qInput.focus(); }, 100);
})();
</script>
</body>
</html>
